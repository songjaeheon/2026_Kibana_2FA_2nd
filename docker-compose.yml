# ==============================================================================
# Elasticsearch run_as 기반 2FA(안면인증) 연동 PoC - Docker Compose 구성 파일
# 환경: Windows Docker Desktop (Linux 컨테이너 모드)
#
# [아키텍처 흐름]
# 사용자 브라우저 -> Nginx (Reverse Proxy, :8080)
#   ├─ /auth/* 등 인증 확인 -> mock-auth-api (가상 2FA 안면인증 서버, :3000)
#   └─ 인증 성공 시 Authorization(대리 계정 Basic Auth) 및
#      es-security-runas-user(실제 로그인 사용자 ID) 헤더를 주입하여
#      -> Kibana (:5601) -> Elasticsearch (:9200) 로 전달
# ==============================================================================

version: "3.8"

# 공통 로깅 옵션 정의 (YAML Anchor 활용)
# 컨테이너 기동 및 운영 중 각 서비스의 로그 상태를 표준 JSON 파일 드라이버로 수집하며,
# 디스크 용량 고갈 방지를 위한 로그 로테이션 및 서비스 식별 태그를 부여합니다.
x-logging-defaults: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    labels: "service,env"
    tag: "{{.Name}}/{{.ID}}"

services:
  # ----------------------------------------------------------------------------
  # 1. Elasticsearch (데이터 저장소 및 RBAC / run_as 인증·인가 엔진)
  # ----------------------------------------------------------------------------
  # [역할]
  # - X-Pack Security를 활성화하여 사용자 인증 및 Role 기반 권한 제어(RBAC)를 수행합니다.
  # - 대리 실행 권한(run_as)을 가진 프록시 계정이 `es-security-runas-user` 헤더와 함께
  #   요청을 보내면, 해당 실제 사용자의 권한으로 쿼리 및 Kibana 접근을 대리 수행합니다.
  #
  # [포트 매핑]
  # - 호스트 9200 -> 컨테이너 9200 : REST API 통신 포트 (Kibana 및 초기화 스크립트 연동, 디버깅용)
  # - 컨테이너 9300 : 노드 간 클러스터 내부 통신 포트 (단일 노드이므로 외부 노출 생략 가능하나 명시)
  # ----------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.14.2
    container_name: poc-elasticsearch
    environment:
      - node.name=es-node-1
      - cluster.name=poc-es-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # JVM 힙 메모리 설정 (Windows Docker Desktop 환경을 고려하여 1GB로 제한)
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      # run_as 기능 사용을 위해 X-Pack Security 필수 활성화
      - xpack.security.enabled=true
      # 초기 슈퍼유저(elastic) 및 기본 시스템 계정 비밀번호 설정
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme123!}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200" # 호스트 PC(:9200)에서 Elasticsearch REST API로 직접 접근하기 위한 포트 매핑
    networks:
      - poc-2fa-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD:-changeme123!} http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    labels:
      service: "elasticsearch"
      env: "poc"
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 2. ES-Setup (Elasticsearch 초기 Role 및 run_as 대리 계정 자동 구성 컨테이너)
  # ----------------------------------------------------------------------------
  # [역할]
  # - Elasticsearch 기동 완료(healthy) 후 실행되어 PoC에 필요한 초기 보안 설정을 주입합니다.
  # - `run_as` 권한을 가진 프록시 전용 Role/User 및 실제 테스트용 사용자 계정을 생성합니다.
  #
  # [포트 매핑]
  # - 일회성 초기화 작업을 수행하는 컨테이너이므로 외부 포트 매핑이 없습니다.
  # ----------------------------------------------------------------------------
  es-setup:
    image: curlimages/curl:8.5.0
    container_name: poc-es-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme123!}
    volumes:
      - ./es-setup/init-es.sh:/init-es.sh:ro
    # Windows 환경의 개행 문자(CRLF) 문제를 방지하기 위해 tr -d '\r' 처리 후 실행
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /init-es.sh | /bin/sh"]
    networks:
      - poc-2fa-net
    labels:
      service: "es-setup"
      env: "poc"
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 3. Kibana (데이터 시각화 및 대시보드 UI)
  # ----------------------------------------------------------------------------
  # [역할]
  # - 앞단의 Nginx 리버스 프록시로부터 전달받은 `authorization` 헤더와
  #   `es-security-runas-user` 헤더를 화이트리스트(`requestHeadersWhitelist`)로 허용하여
  #   백엔드 Elasticsearch로 투명하게 전달합니다.
  #
  # [포트 매핑]
  # - 호스트 5601 -> 컨테이너 5601 : Kibana 웹 UI 포트
  #   (실제 2FA 연동 접속은 Nginx :8080을 통해 이루어지며, :5601은 직접 상태 확인 및 디버깅용)
  # ----------------------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:7.14.2
    container_name: poc-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-changeme123!}
    volumes:
      # 한글 주석과 requestHeadersWhitelist가 포함된 kibana.yml 마운트
      - ./es-setup/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601" # 호스트 PC(:5601)에서 Kibana 웹 서버에 직접 접근(디버깅용)하기 위한 포트 매핑
    networks:
      - poc-2fa-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601/api/status | grep -q 'HTTP/1.1 200 OK\\|HTTP/1.1 302 Found\\|HTTP/1.1 401 Unauthorized'"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 40s
    labels:
      service: "kibana"
      env: "poc"
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 4. mock-auth-api (가상 2FA 안면인증 서버)
  # ----------------------------------------------------------------------------
  # [역할]
  # - 사용자 1차 로그인 및 2차 안면인증(2FA)을 모사하는 경량 인증 서버입니다.
  # - Nginx의 `auth_request` 모듈과 연동하여 현재 세션/토큰이 2FA 인증을 완료했는지 검증하고,
  #   인증 완료 시 응답 헤더(`X-Authenticated-User`)로 검증된 사용자 ID를 Nginx에 반환합니다.
  #
  # [포트 매핑]
  # - 호스트 3000 -> 컨테이너 3000 : 2FA 인증 API 및 테스트용 인증 화면 직접 호출 포트
  # ----------------------------------------------------------------------------
  mock-auth-api:
    build:
      context: ./auth-api
      dockerfile: Dockerfile
    container_name: poc-mock-auth-api
    environment:
      - PORT=3000
      - NODE_ENV=development
    volumes:
      - ./auth-api:/app
      - /app/node_modules
    ports:
      - "3000:3000" # 호스트 PC(:3000)에서 가상 2FA API 상태를 테스트하기 위한 포트 매핑
    networks:
      - poc-2fa-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      service: "mock-auth-api"
      env: "poc"
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 5. Nginx (2FA 연동 게이트웨이 및 리버스 프록시)
  # ----------------------------------------------------------------------------
  # [역할]
  # - 클라이언트의 모든 요청을 가장 먼저 수신하는 단일 진입점(Single Entrypoint)입니다.
  # - 내부 서브요청(`auth_request`)으로 `mock-auth-api`에 2FA(안면인증) 여부를 질의합니다.
  # - 2FA가 완료된 요청에 대해 대리 계정(`Authorization: Basic ...`) 헤더와
  #   실제 사용자 ID(`es-security-runas-user`) 헤더를 주입하여 Kibana로 프록시합니다.
  #
  # [포트 매핑]
  # - 호스트 8080 -> 컨테이너 80 : 사용자가 브라우저로 접속하는 메인 웹 프록시 포트
  #   (Windows 환경에서 80 포트 충돌을 방지하기 위해 호스트 포트는 8080으로 매핑)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: poc-nginx
    depends_on:
      mock-auth-api:
        condition: service_healthy
      kibana:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80" # 호스트 PC(:8080) -> Nginx 컨테이너(:80) 리버스 프록시 진입 포트 매핑
    networks:
      - poc-2fa-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      service: "nginx"
      env: "poc"
    logging: *default-logging

# ==============================================================================
# 네트워크 및 볼륨 설정
# ==============================================================================
networks:
  # 모든 PoC 컨테이너가 서비스 이름(DNS)으로 상호 통신하는 브리지 네트워크
  poc-2fa-net:
    driver: bridge
    name: poc-2fa-network

volumes:
  # 컨테이너 재시작 시에도 Elasticsearch 인덱스 및 사용자/Role 정보를 유지하기 위한 영구 볼륨
  es-data:
    driver: local
