# ==============================================================================
# Nginx 리버스 프록시 및 2FA 게이트웨이 설정 (nginx/nginx.conf)
#
# [서비스 역할]
# - 사용자의 Kibana 접근 요청을 가로채어 `mock-auth-api`(:3000)를 통해 2FA(안면인증)
#   완료 여부를 검증(`auth_request`)합니다.
# - 검증 성공 시 Elasticsearch `run_as` 동작에 필요한 두 가지 핵심 헤더를 주입합니다:
#   1) `Authorization`: run_as 권한을 보유한 대리 계정(proxy_admin)의 Basic 인증 정보
#   2) `es-security-runas-user`: 2FA를 통과한 실제 사용자 계정명
#
# [포트 매핑]
# - 호스트 8080 -> 컨테이너 80 (클라이언트 브라우저 접속용 진입 포트)
# - 내부 프록시 대상:
#   * mock-auth-api:3000 (2FA 인증 검증 및 로그인 처리)
#   * kibana:5601 (인증 완료 후 Kibana UI 전달)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    # 컨테이너 상태 파악을 위한 상세 액세스 로그 포맷 정의 (run_as 주입 사용자 포함)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" runas_user="$auth_user"';

    access_log /dev/stdout main;
    error_log  /dev/stderr info;

    upstream kibana_upstream {
        server kibana:5601;
    }

    upstream auth_api_upstream {
        server mock-auth-api:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. 컨테이너 헬스체크 전용 엔드포인트
        location = /nginx-health {
            access_log off;
            return 200 "OK\n";
        }

        # 2. 내부 2FA 검증 서브요청 엔드포인트 (외부 직접 호출 불가)
        location = /_auth/verify {
            internal;
            proxy_pass http://auth_api_upstream/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
        }

        # 3. 2FA 안면인증 로그인/상태 제어 API 경로 (mock-auth-api로 프록시)
        location /auth/ {
            proxy_pass http://auth_api_upstream/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Kibana 메인 프록시 경로 (2FA 검증 통과 필수)
        location / {
            # mock-auth-api에 현재 사용자의 2FA 인증 상태를 먼저 질의
            auth_request /_auth/verify;

            # mock-auth-api가 응답 헤더(X-Authenticated-User)로 내려준 실제 사용자 ID 추출
            auth_request_set $auth_user $upstream_http_x_authenticated_user;

            # 미인증(401) 발생 시 가상 2FA 안내/인증 페이지로 리다이렉트
            error_page 401 = @error401;

            # [핵심] 대리 실행 계정(proxy_admin:changeme123!)의 Basic Auth 헤더 주입
            # Base64("proxy_admin:changeme123!") = "cHJveHlfYWRtaW46Y2hhbmdlbWUxMjMh"
            proxy_set_header Authorization "Basic cHJveHlfYWRtaW46Y2hhbmdlbWUxMjMh";

            # [핵심] 실제 권한을 부여받을 2FA 인증 완료 사용자 ID 주입
            proxy_set_header es-security-runas-user $auth_user;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_pass http://kibana_upstream;
        }

        # 2FA 미인증 시 로그인 안내 엔드포인트로 이동
        location @error401 {
            return 302 /auth/login-page;
        }
    }
}

