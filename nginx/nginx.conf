# ==============================================================================
# Nginx 2FA(안면인증) 연동 및 Elasticsearch run_as 리버스 프록시 설정 (nginx/nginx.conf)
#
# [핵심 아키텍처 및 동작 원리]
# 1. 클라이언트가 `/` 이하(Kibana) 경로로 접근하면 Nginx가 `auth_request /auth`를 통해
#    내부적으로 `mock-auth-api`(:3000/auth)에 2FA 인증 여부를 먼저 질의합니다.
# 2. `mock-auth-api`가 HTTP 200과 함께 `X-Authenticated-User: {사용자ID}` 응답 헤더를 반환하면,
#    Nginx는 이 값을 추출하여 `$runas_user` 변수에 저장합니다.
# 3. 이후 Kibana(:5601)로 요청을 전달할 때:
#    - `Authorization` 헤더는 Elasticsearch `run_as` 대리 실행 권한을 가진 프록시 전용 계정
#      (`proxy_user:proxy_password`)의 Base64 인코딩 값으로 강제 덮어쓰기(Overwrite)합니다.
#    - `es-security-runas-user` 헤더에는 앞서 추출한 실제 사원 ID(`$runas_user`)를 주입합니다.
# ==============================================================================

# [전역 에러 로그 설정]
# 컨테이너 표준 에러(/dev/stderr)로 에러 및 인증 디버깅 정보를 출력하도록 설정합니다.
# notice 레벨 이상을 기록하여 설정 로드 상태, 업스트림 연결 실패, auth_request 실패 원인을 파악합니다.
error_log /dev/stderr notice;

# 워커 프로세스 수를 CPU 코어 수에 맞게 자동 할당합니다.
worker_processes auto;

# [events 블록]
# Nginx 워커 프로세스당 동시에 처리할 수 있는 최대 네트워크 커넥션 수를 지정합니다.
# Kibana는 초기 로딩 시 다수의 정적 자산(JS/CSS/API) 요청을 동시에 발생시키므로 1024 이상으로 설정합니다.
events {
    worker_connections 1024;
}

# [http 블록]
# HTTP/HTTPS 프록시 처리, 로깅 포맷, 업스트림 서버 그룹, 가상 호스트(server) 설정을 담당합니다.
http {
    # 기본 MIME 타입 정의 파일을 로드하여 정적 리소스 응답 시 올바른 Content-Type을 보장합니다.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --------------------------------------------------------------------------
    # [요구사항 4] 상세 감사 및 디버깅을 위한 커스텀 접근 로그 포맷 (runas_audit_log)
    # --------------------------------------------------------------------------
    # 왜 필요한가?
    # - 프록시 계정이 모든 요청을 대리 실행(run_as)하므로, 실제로 어느 IP의 어떤 사원(runas_user)이
    #   언제 어떤 API를 호출했는지, 그리고 인증 서버 및 Kibana(upstream)에서 응답 시간이 얼마나 걸렸는지
    #   추적(Audit)하기 위해 반드시 커스텀 로그 포맷이 필요합니다.
    #
    # 포함 항목 설명:
    # - client_ip: 접속한 클라이언트의 실제 IP 주소 ($remote_addr)
    # - time_iso8601 / time_local: 요청이 인입된 타임스탬프 ($time_iso8601)
    # - runas_user: mock-auth-api에서 검증되어 위임(impersonation)된 실제 사원 ID ($runas_user)
    # - request: 클라이언트가 요청한 HTTP 메서드, URI, 프로토콜 버전 ($request)
    # - status: 클라이언트에 최종 반환된 HTTP 상태 코드 ($status)
    # - bytes_sent: 전송된 응답 본문 크기 ($body_bytes_sent)
    # - request_time: Nginx가 요청을 받아 최종 응답을 마칠 때까지 걸린 전체 처리 시간(초) ($request_time)
    # - upstream_addr: 요청을 처리한 백엔드(mock-auth-api / kibana) 컨테이너 IP:Port ($upstream_addr)
    # - upstream_status: 백엔드 서버가 반환한 HTTP 상태 코드 ($upstream_status)
    # - upstream_response_time: 백엔드(upstream) 서버가 응답하는 데 소요된 시간(초) ($upstream_response_time)
    # - user_agent: 클라이언트 브라우저/도구 식별 문자열 ($http_user_agent)
    # --------------------------------------------------------------------------
    log_format runas_audit_log
        'client_ip="$remote_addr" '
        'time="$time_iso8601" '
        'runas_user="$runas_user" '
        'request="$request" '
        'status=$status '
        'bytes_sent=$body_bytes_sent '
        'request_time=${request_time}s '
        'upstream_addr="$upstream_addr" '
        'upstream_status="$upstream_status" '
        'upstream_response_time="${upstream_response_time}s" '
        'referer="$http_referer" '
        'user_agent="$http_user_agent"';

    # 접근 로그(access.log)를 컨테이너 표준 출력(/dev/stdout)으로 보내어
    # Docker logging driver(json-file) 및 `docker compose logs`에서 실시간으로 조회할 수 있게 합니다.
    access_log /dev/stdout runas_audit_log;

    # HTTP 레벨 에러 로그 역시 상세 파악을 위해 표준 에러(/dev/stderr)에 info 레벨로 기록합니다.
    error_log  /dev/stderr info;

    # 대용량 Kibana 대시보드 저장/조회 및 긴 헤더(Authorization, Cookie 등) 처리를 위한 버퍼 및 타임아웃 최적화
    sendfile            on;
    keepalive_timeout   65;
    client_max_body_size 50m;
    proxy_buffers       8 16k;
    proxy_buffer_size   32k;

    # --------------------------------------------------------------------------
    # [upstream 블록 1: kibana_upstream]
    # --------------------------------------------------------------------------
    # 왜 필요한가?
    # - 2FA 인증이 완료된 트래픽을 전달할 백엔드 Kibana 컨테이너(kibana:5601)를 정의합니다.
    # - keepalive를 설정하여 Nginx와 Kibana 간의 TCP 연결 재사용률을 높이고 지연시간을 줄입니다.
    upstream kibana_upstream {
        server kibana:5601;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # [upstream 블록 2: auth_api_upstream]
    # --------------------------------------------------------------------------
    # 왜 필요한가?
    # - `auth_request` 서브요청을 처리할 가상 2FA(안면인증) 서버(mock-auth-api:3000)를 정의합니다.
    upstream auth_api_upstream {
        server mock-auth-api:3000;
        keepalive 16;
    }

    # --------------------------------------------------------------------------
    # [server 블록: 2FA 인증 게이트웨이 가상 호스트]
    # --------------------------------------------------------------------------
    server {
        # 컨테이너 내부 80번 포트에서 HTTP 트래픽을 수신합니다 (docker-compose에서 호스트 8080:80 매핑).
        listen 80;
        server_name localhost;

        # 인증 실패(401) 등으로 인해 $runas_user 변수가 채워지지 않은 요청에서도
        # 로그 포맷(runas_audit_log)에 경고가 발생하지 않도록 기본값을 '-'로 초기화합니다.
        set $runas_user "-";

        # ----------------------------------------------------------------------
        # [location 1: /nginx-health (컨테이너 상태 확인용 엔드포인트)]
        # ----------------------------------------------------------------------
        # 왜 필요한가?
        # - Docker의 healthcheck가 2FA 인증 절차 없이도 Nginx 프로세스의 정상 동작 여부를
        #   주기적으로 확인할 수 있도록 별도로 분리한 경량 엔드포인트입니다.
        location = /nginx-health {
            # 헬스체크 요청이 접근 로그를 불필요하게 채우지 않도록 로깅을 비활성화합니다.
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        # ----------------------------------------------------------------------
        # [location 2: = /auth (요구사항 1 - Nginx auth_request 전용 내부 엔드포인트)]
        # ----------------------------------------------------------------------
        # 왜 필요한가?
        # - `/` 경로로 들어온 모든 요청에 대해 `auth_request /auth;` 지시어가 호출하는
        #   내부 서브요청(Subrequest) 전용 블록입니다.
        # - `internal;` 지시어를 통해 외부 클라이언트가 `/auth`를 직접 우회 호출하는 것을 차단합니다.
        location = /auth {
            internal;

            # 가상 2FA 서버(mock-auth-api)의 `/auth` 엔드포인트로 인증 검증 요청을 전달합니다.
            proxy_pass http://auth_api_upstream/auth;

            # auth_request는 헤더와 쿠키만으로 인증을 판별하므로 요청 본문(Body)은 전송하지 않아 성능을 높입니다.
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            # 클라이언트가 원래 접근하려던 요청 URI, IP, 메서드를 인증 서버에 전달하여 상세 디버그 로깅을 돕습니다.
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Real-IP $remote_addr;

            # 클라이언트가 보낸 Authorization 헤더(Bearer/Basic)나 2FA 쿠키를 mock-auth-api로 그대로 전달합니다.
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-2FA-User $http_x_2fa_user;
            proxy_set_header Cookie $http_cookie;
        }

        # ----------------------------------------------------------------------
        # [location 3: /auth/ (브라우저용 가상 2FA 로그인 화면 및 쿠키 발급 API 경로)]
        # ----------------------------------------------------------------------
        # 왜 필요한가?
        # - 사용자가 미인증 상태에서 브라우저로 접속했을 때 리다이렉트되는 `/auth/login-page`,
        #   안면인증 승인 처리 `/auth/verify-face`, 로그아웃 `/auth/logout` 요청은
        #   `auth_request` 검증 없이 `mock-auth-api`로 직접 전달되어야 무한 리다이렉트가 발생하지 않습니다.
        location /auth/ {
            proxy_pass http://auth_api_upstream/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------------------------
        # [location 4: / (요구사항 1, 2, 3 - Kibana 메인 프록시 및 run_as 헤더 주입 블록)]
        # ----------------------------------------------------------------------
        # 왜 필요한가?
        # - Kibana로 향하는 모든 트래픽에 대해 2FA 검증을 강제하고,
        #   검증 통과 시 프록시 대리 계정(Authorization)과 위임 사원 ID(es-security-runas-user)를
        #   주입하여 Kibana로 전달하는 핵심 게이트웨이 블록입니다.
        location / {
            # [요구사항 1] 모든 인입 트래픽에 대해 먼저 내부 `/auth` 엔드포인트로 서브요청을 보내
            # HTTP 200 응답이 올 때만 아래 Kibana 프록시 로직을 진행합니다 (401/403 시 즉시 차단).
            auth_request /auth;

            # [요구사항 2-1] auth_request 성공 시, mock-auth-api가 응답 헤더로 반환한
            # `X-Authenticated-User` 값을 Nginx 내부 변수 `$upstream_http_x_authenticated_user`로 읽어와
            # `$runas_user` 변수에 저장합니다. (접근 로그 및 Kibana 요청 헤더 주입에 공통 사용)
            auth_request_set $runas_user $upstream_http_x_authenticated_user;

            # 브라우저 접속 시 2FA 미인증(HTTP 401)이 발생하면 아래 `@error401` 블록으로 제어권을 넘깁니다.
            error_page 401 = @error401;

            # [요구사항 2-2] Kibana로 보내는 요청 헤더에 `es-security-runas-user`를 추가하고,
            # mock-auth-api로부터 검증받은 실제 사원 ID(`$runas_user`)를 주입합니다.
            # Kibana는 kibana.yml의 `elasticsearch.requestHeadersWhitelist` 설정에 의해
            # 이 헤더를 Elasticsearch까지 전달하여 해당 사원의 권한으로 쿼리를 수행하게 합니다.
            proxy_set_header es-security-runas-user $runas_user;

            # [요구사항 3] 클라이언트가 보낸 기존 `Authorization` 헤더(2FA 검증용 토큰 등)가
            # 그대로 Elasticsearch에 전달되면 인증 충돌이 발생하므로,
            # Elasticsearch에서 `run_as` 권한을 부여받은 프록시 전용 계정(`proxy_user:proxy_password`)의
            # Base64 인코딩 값("cHJveHlfdXNlcjpwcm94eV9wYXNzd29yZA==")으로 강제 덮어쓰기합니다.
            # (참고: echo -n "proxy_user:proxy_password" | base64 -> cHJveHlfdXNlcjpwcm94eV9wYXNzd29yZA==)
            proxy_set_header Authorization "Basic cHJveHlfdXNlcjpwcm94eV9wYXNzd29yZA==";

            # Kibana 웹소켓/장기 연결 및 리버스 프록시 표준 헤더 전달 설정
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 인증 및 헤더 변환이 완료된 요청을 백엔드 Kibana 컨테이너로 전달합니다.
            proxy_pass http://kibana_upstream;
        }

        # ----------------------------------------------------------------------
        # [location 5: @error401 (2FA 인증 실패 시 처리 블록)]
        # ----------------------------------------------------------------------
        # 왜 필요한가?
        # - `auth_request /auth` 결과가 401 Unauthorized일 때 호출되는 Named Location입니다.
        # - API/CLI 호출(Authorization 헤더 사용)이나 브라우저 접속 시 미인증 상태를 명확히 알리거나
        #   가상 2FA 로그인 페이지(`/auth/login-page`)로 유도하기 위해 설정합니다.
        location @error401 {
            # 브라우저에서 접속한 경우(Accept 헤더에 text/html 포함) 2FA 로그인 페이지로 302 리다이렉트하고,
            # cURL/API 클라이언트인 경우 401 상태 코드와 JSON 에러 메시지를 그대로 반환합니다.
            default_type application/json;
            return 401 '{"authenticated":false,"error":"Unauthorized","message":"2FA(안면인증) 검증에 실패했습니다. Authorization 헤더를 포함하거나 /auth/login-page 에서 인증을 진행하세요."}\n';
        }
    }
}
